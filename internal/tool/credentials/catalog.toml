# Named credential bundles. `claude`, `opencode`, `pi`, and `omp` back the builtin
# Tool implementations' ToolWithConfigDirFiles methods (internal/tool), which
# read these values directly — this catalog is the single source of truth,
# and file seeding for builtin tools and profile [[credentials]] entries
# alike goes through the one session.seedHostFile primitive, so there is no
# second copy of either the values or the mechanics to keep in sync. Other
# entries (e.g. `ollama`) are third-party bundles referenced from profile
# [[credentials]] entries via `bundle = "<name>"`; only config_dir, files, and
# (optionally) mode apply to those — sandbox_settings_file/state_file/
# always_setup/auto_context_file are only meaningful for tools consumed
# through internal/tool's ToolWithConfigDirFiles interface.

[claude]
config_dir = ".claude"
files = [".credentials.json", "config.yml", "settings.json", "CLAUDE.md"]
state_file = ".claude.json"
sandbox_settings_file = "settings.json"
always_setup = false
auto_context_file = ".claude/CLAUDE.md"

[opencode]
config_dir = ".config/opencode"
files = ["opencode.json", "tui.json"]
sandbox_settings_file = "opencode.json"
always_setup = true

[pi]
config_dir = ".pi/agent"
files = ["settings.json", "models.json", "auth.json", "AGENTS.md"]
sandbox_settings_file = "settings.json"
always_setup = true

# omp (https://omp.sh) is a fork of pi that stores credentials in a SQLite
# database (agent.db) rather than auth.json, so we deliberately do NOT
# copy that DB — it is created and managed by omp itself, and copying in
# a stale host DB would orphan the user's oauth tokens. settings.json and
# AGENTS.md are user-authored and safe to copy verbatim.
[omp]
config_dir = ".omp/agent"
files = ["settings.json", "models.json", "AGENTS.md"]
sandbox_settings_file = "settings.json"
always_setup = true

[ollama]
config_dir = ".ollama"
files = ["id_ed25519"]
mode = "0600"
